<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Pills Demo — Search PLP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="search-header">
    <h1 class="search-title">Results for "bike apparel"</h1>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div class="brand-row" id="brandRow"></div>

  <div class="filter-section">
    <div class="pills-scroll-wrap" id="pillsScrollWrap">
      <div class="pills-row" id="pillsRow"></div>
      <button class="scroll-btn scroll-btn--left" id="pillsScrollLeft" aria-label="Scroll left" hidden>
        <svg width="6" height="9" viewBox="0 0 6 9" fill="none"><path d="M5 1L1.5 4.5L5 8" stroke="#252525" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="scroll-btn scroll-btn--right" id="pillsScrollRight" aria-label="Scroll right" hidden>
        <svg width="6" height="9" viewBox="0 0 6 9" fill="none"><path d="M1 1L4.5 4.5L1 8" stroke="#252525" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="applied-row" id="appliedRow"></div>
  </div>

  <div class="results-section">
    <!-- §8 zero results — pill row + chip row stay visible above this -->
    <div class="zero-state" id="zeroState">
      <div class="zero-head" id="zeroHead"></div>
      <div class="zero-sub">Try removing one of these to widen your results.</div>
      <div class="relax-list" id="relaxList"></div>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</div>

<!-- All Filters overlay + panel -->
<div id="afOverlay" class="af-overlay"></div>
<div id="afPanel" class="af-panel" role="dialog" aria-modal="true" aria-label="All filters">
  <div class="af-header">
    <h2 class="af-title" id="afTitle">All Filters</h2>
    <!-- Close Icon 168:1913 — 36px, drawn at #9d9d9d -->
    <button class="af-close-btn" id="afCloseBtn" aria-label="Close all filters">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <path d="M19.3831 18.0001L26.7026 10.7291C27.0825 10.3501 27.1014 9.71707 26.7423 9.31407C26.3842 8.91207 25.7845 8.89507 25.4037 9.27107L17.9999 16.6261L10.5971 9.27107C10.2153 8.89407 9.6166 8.91207 9.25755 9.31407C8.89849 9.71707 8.91744 10.3501 9.29828 10.7291L16.6168 18.0001L9.29828 25.2721C8.91744 25.6501 8.89849 26.2831 9.25755 26.6861C9.44418 26.8951 9.69523 27.0001 9.94724 27.0001C10.1803 27.0001 10.4133 26.9101 10.5971 26.7291L17.9999 19.3741L25.4037 26.7291C25.5865 26.9101 25.8196 27.0001 26.0527 27.0001C26.3047 27.0001 26.5557 26.8951 26.7423 26.6861C27.1014 26.2831 27.0825 25.6501 26.7026 25.2721L19.3831 18.0001" fill="#9D9D9D"/>
      </svg>
    </button>
  </div>
  <div class="af-body" id="afBody"></div>
  <div class="af-footer">
    <!-- 168:2086 — the count reflects the staged draft, not the applied state -->
    <div class="af-result-count" id="afResultCount"></div>
    <div class="af-footer-btns">
      <button class="af-btn-clear" id="afClearAllBtn">Reset</button>
      <button class="af-btn-done" id="afDoneBtn">Done</button>
    </div>
  </div>
</div>

<!-- Dropdown (portal) -->
<div id="filterDropdown" class="dropdown" role="dialog" aria-modal="false">
  <div class="dropdown-caret" id="dropdownCaret"></div>
  <div class="dropdown-items" id="dropdownItems"></div>
  <div class="dropdown-footer">
    <button class="dropdown-btn-clear" id="dropdownClear">Clear</button>
    <button class="dropdown-btn-done" id="dropdownDone">Apply</button>
  </div>
</div>

<!-- §2 — on mobile every pill opens a bottom sheet -->
<div id="sheetOverlay" class="sheet-overlay"></div>
<div id="filterSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grab"></div>
  <div class="sheet-header">
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <button class="sheet-close" id="sheetClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 2l14 14M16 2L2 16" stroke="#252525" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-footer">
    <button class="sheet-clear" id="sheetClear">Clear all</button>
    <!-- §5 — CTA states the live result count, shimmers while counts resolve -->
    <button class="sheet-cta" id="sheetCta"></button>
  </div>
</div>


<script src="script.js"></script>

</body>
</html>
